# Servidor de la landing del ápice. Un solo archivo estático y autocontenido (todo el CSS, el JS y la
# fuente van EN LÍNEA en index.html; no pide ningún recurso externo). Se monta en
# /etc/nginx/conf.d/default.conf (ro).

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;

    # El HTML lleva una fuente embebida en base64: gzip le baja el peso a menos de la mitad.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # Cabeceras para una página estática sin recursos externos. El CSP es estricto a propósito: solo
    # admite el estilo y el script EN LÍNEA de la propia página y la fuente embebida como data:. Si algún
    # día la landing carga algo de fuera (un script de analítica, por ejemplo), hay que abrirle hueco aquí.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    # Un solo archivo que cambia en cada deploy: cachea corto y revalida.
    add_header Cache-Control "public, max-age=300, must-revalidate" always;

    # Sonda del healthcheck del compose. Sin log y con un 200 plano.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
